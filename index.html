      };
      window.kvmPixStatus = async function (id) {
        try {
          var r = await fetch('/api/status?id=' + encodeURIComponent(id));
          if (!r.ok) return { data: null, error: new Error('erro') };
          return { data: await r.json(), error: null };
        } catch (e) { return { data: null, error: e }; }
      };

    <div id="root"></div>
    <script>
      (function () {
        var UTMS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'];
        try {
          var params = new URLSearchParams(window.location.search);
          UTMS.forEach(function (k) {
            var v = params.get(k);
            if (v) {
              try { localStorage.setItem(k, v); } catch (e) {}
              try { sessionStorage.setItem(k, v); } catch (e) {}
            }
          });
        } catch (e) {}

        function readUtm(k) {
          try { return localStorage.getItem(k) || sessionStorage.getItem(k); }
          catch (e) { return null; }
        }

        window.attachUtmParams = function (href) {
          try {
            var url = new URL(href, window.location.origin);
            UTMS.forEach(function (k) {
              var v = readUtm(k);
              if (v && !url.searchParams.get(k)) url.searchParams.set(k, v);
            });
            return url.toString();
          } catch (e) { return href; }
        };

        function decorateLinks() {
          document.querySelectorAll('a[href]').forEach(function (link) {
            try {
              var url = new URL(link.href);
              var changed = false;
              UTMS.forEach(function (k) {
                var v = readUtm(k);
                if (v && !url.searchParams.get(k)) {
                  url.searchParams.set(k, v);
                  changed = true;
                }
              });
              if (changed) link.href = url.toString();
            } catch (e) {}
          });
        }

        // Initial pass + observe SPA-rendered links
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', decorateLinks);
        } else {
          decorateLinks();
        }
        try {
          var mo = new MutationObserver(function () { decorateLinks(); });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
