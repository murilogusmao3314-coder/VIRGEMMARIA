        } catch (e) { if (mem[key]) return false; mem[key] = 1; return true; }

        try { if (ok()) fbq('track', name, params || {}, { eventID: eid || (name + '-' + sid + '-' + key) }); } catch (e) {}
      }
      function custom(key, name, params) {
        if (!first(key)) return;

          });
        }

        // Initial pass + observe SPA-rendered links
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', decorateLinks);
        } else {
          decorateLinks();
        }
        try {
          var mo = new MutationObserver(function () { decorateLinks(); });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
