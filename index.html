      // Integração PIX (PinguPag) - chama as funções /api/pix e /api/status (chave secreta fica no servidor)
      window.kvmPix = async function (body) {
        try {
          try {
            var ck = function (n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; };
            var fbc = ck('_fbc'), fbclid = new URLSearchParams(location.search).get('fbclid');
            if (!fbc && fbclid) fbc = 'fb.1.' + Date.now() + '.' + fbclid;
            body.meta = { fbp: ck('_fbp'), fbc: fbc };
          } catch (e) {}
          var r = await fetch('/api/pix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          var d = await r.json().catch(function () { return {}; });
          if (!r.ok) return { data: null, error: new Error(d.error || 'Não foi possível gerar o PIX.') };
          return { data: d, error: null };
        } catch (e) { return { data: null, error: new Error('Falha de conexão. Tente novamente.') }; }
      };
      window.kvmPixStatus = async function (id) {
        try {
          var r = await fetch('/api/status?id=' + encodeURIComponent(id));
          if (!r.ok) return { data: null, error: new Error('erro') };
          return { data: await r.json(), error: null };
        } catch (e) { return { data: null, error: e }; }
      };

    <!-- Eventos do Meta Pixel (funil completo, sem duplicar) -->
    <script>
    (function () {
      var CUR = 'BRL', mem = {};
      function ok() { return typeof window.fbq === 'function'; }
      // Trava: devolve true só na 1ª vez (por sessão do navegador; "persist" = permanente neste navegador)
      function first(key, persist) {
        try {
          var st = persist ? localStorage : sessionStorage;
          if (st.getItem('kvm:ev:' + key)) return false;
          st.setItem('kvm:ev:' + key, '1'); return true;
        } catch (e) { if (mem[key]) return false; mem[key] = 1; return true; }
      }
      var sid; try { sid = sessionStorage.getItem('kvm:sid'); if (!sid) { sid = Math.random().toString(36).slice(2, 10); sessionStorage.setItem('kvm:sid', sid); } } catch (e) { sid = 'x'; }
      // Evento padrão, sempre com eventID (deduplicação na Meta) e uma única vez por "key"
      function std(key, name, params, eid, persist) {
        if (!first(key, persist)) return;
        try { if (ok()) fbq('track', name, params || {}, { eventID: eid || (name + '-' + sid + '-' + key) }); } catch (e) {}
      }
      function custom(key, name, params) {
        if (!first(key)) return;
        try { if (ok()) fbq('trackCustom', name, params || {}); } catch (e) {}
      }
      // Compra: 1 única vez por venda, mesmo em outra aba/recarregando. eventID = o mesmo usado no servidor (API de Conversões).
      window.kvmPurchase = function (reference, value, name) {
        std('purchase:' + reference, 'Purchase', { value: value, currency: CUR, content_type: 'product', content_name: name || 'Kit Virgem Maria', num_items: 1 }, 'purchase-' + reference, true);
      };
      window.kvmPixGenerated = function (id, value) {
        custom('pixgen:' + id, 'PixGerado', { value: value, currency: CUR });
        std('pay:' + value, 'AddPaymentInfo', { value: value, currency: CUR, content_type: 'product' });
        std('lead:' + value, 'Lead', { value: value, currency: CUR, content_name: 'Kit Virgem Maria' });
      };
      window.kvmPixCopied = function (id, value) { custom('pixcopy:' + id, 'PixCopiado', { value: value, currency: CUR }); };
      window.kvmFinalizeClick = function (value) { custom('fin:' + value, 'FinalizarClick', { value: value, currency: CUR }); };

      var lastPath = null, lastKey = '', lastAt = 0;
      function onRoute() {
        var path = location.pathname || '/', qs = new URLSearchParams(location.search);
        var valor = parseFloat(qs.get('valor')), has = isFinite(valor) && valor > 0;
        var key = path + '|' + (has ? valor : '');
        var now = Date.now();
        if (key === lastKey && now - lastAt < 2000) return; // pushState + replaceState seguidos = 1 só
        lastKey = key; lastAt = now;
        if (lastPath !== null && path !== lastPath) { try { if (ok()) fbq('track', 'PageView'); } catch (e) {} } // 1º PageView é do próprio pixel
        if (lastPath === path) return; // mudou só a query: não repete eventos
        lastPath = path;
        if (path === '/' || path === '') {
          std('vc:home', 'ViewContent', { content_name: 'Kit Virgem Maria', content_type: 'product', content_category: 'Doação', currency: CUR });
        } else if (path.indexOf('/personalizar') === 0) {
          var p = { currency: CUR, content_type: 'product', content_name: 'Kit Virgem Maria', num_items: 1 };
          if (has) p.value = valor;
          std('atc:' + valor, 'AddToCart', p);
          std('ic:' + valor, 'InitiateCheckout', p);
          custom('pers:' + valor, 'Personalizar', has ? { value: valor, currency: CUR } : {});
        } else if (path.indexOf('/endereco') === 0) {
          custom('end:' + valor, 'EnderecoEtapa', has ? { value: valor, currency: CUR } : {});
        } else if (path.indexOf('/upsell') === 0) {
          std('vc:upsell', 'ViewContent', { content_name: 'Quadro Nossa Senhora Aparecida', content_type: 'product', value: 29.9, currency: CUR });
          custom('upsell', 'UpsellVisto', { value: 29.9, currency: CUR });
        }
      }
      ['pushState', 'replaceState'].forEach(function (m) {
        var orig = history[m];
        history[m] = function () { var r = orig.apply(this, arguments); setTimeout(onRoute, 0); return r; };
      });
      window.addEventListener('popstate', function () { setTimeout(onRoute, 0); });
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onRoute); else onRoute();

      window.addEventListener('scroll', function () {
        var d = document.documentElement, pct = (d.scrollTop + window.innerHeight) / d.scrollHeight * 100;
        if (pct >= 50) custom('s50', 'Scroll50');
        if (pct >= 90) custom('s90', 'Scroll90');
      }, { passive: true });
      setTimeout(function () { custom('t30', 'Tempo30s'); }, 30000);
      setTimeout(function () { custom('t60', 'Tempo60s'); }, 60000);
    })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var UTMS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'];
        try {
          var params = new URLSearchParams(window.location.search);
          UTMS.forEach(function (k) {
            var v = params.get(k);
            if (v) {
              try { localStorage.setItem(k, v); } catch (e) {}
              try { sessionStorage.setItem(k, v); } catch (e) {}
            }
          });
        } catch (e) {}

        function readUtm(k) {
          try { return localStorage.getItem(k) || sessionStorage.getItem(k); }
          catch (e) { return null; }
        }

        window.attachUtmParams = function (href) {
          try {
            var url = new URL(href, window.location.origin);
            UTMS.forEach(function (k) {
              var v = readUtm(k);
              if (v && !url.searchParams.get(k)) url.searchParams.set(k, v);
            });
            return url.toString();
          } catch (e) { return href; }
        };

        function decorateLinks() {
          document.querySelectorAll('a[href]').forEach(function (link) {
            try {
              var url = new URL(link.href);
              var changed = false;
              UTMS.forEach(function (k) {
                var v = readUtm(k);
                if (v && !url.searchParams.get(k)) {
                  url.searchParams.set(k, v);
                  changed = true;
                }
              });
              if (changed) link.href = url.toString();
            } catch (e) {}
          });
        }

        // Initial pass + observe SPA-rendered links
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', decorateLinks);
        } else {
          decorateLinks();
        }
        try {
          var mo = new MutationObserver(function () { decorateLinks(); });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
